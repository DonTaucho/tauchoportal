{{define "login"}}
<div class="error-message" id="errorMessage"></div>
<form id="loginForm">
    <div class="form-group">
        <label for="identifier">{{.I18n.T "login.usernameOrEmail"}}</label>
        <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            required
            placeholder="{{.I18n.T "login.usernameOrEmailPlaceholder"}}"
            autocomplete="username"
        >
    </div>
    
    <div class="form-group">
        <label for="password">{{.I18n.T "login.password"}}</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            required
            placeholder="{{.I18n.T "login.passwordPlaceholder"}}"
            autocomplete="current-password"
        >
    </div>
    
    <button type="submit" class="submit-btn">{{.I18n.T "login.signInButton"}}</button>
</form>

<div class="divider">
    <span>{{.I18n.T "login.orContinueWith"}}</span>
</div>

<div class="oauth-buttons">
    <button type="button" onclick="startOAuthLogin('google')" class="oauth-btn youtube-btn">
        <span class="oauth-icon">{{platformIcon "youtube"}}</span>
        <span>{{.I18n.T "login.youtubeLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('twitch')" class="oauth-btn twitch-btn">
        <span class="oauth-icon">{{platformIcon "twitch"}}</span>
        <span>{{.I18n.T "login.twitchLogin"}}</span>
    </button>
    <button type="button" onclick="openNicoLoginModal()" class="oauth-btn niconico-btn">
        <span class="oauth-icon">{{platformIcon "niconico"}}</span>
        <span>{{.I18n.T "login.nicoNicoLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('twitcasting')" class="oauth-btn twitcasting-btn">
        <span class="oauth-icon">{{platformIcon "twitcasting"}}</span>
        <span>{{.I18n.T "login.twitcastingLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('instagram')" class="oauth-btn instagram-btn">
        <span class="oauth-icon">{{platformIcon "instagram"}}</span>
        <span>{{.I18n.T "login.instagramLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('tiktok')" class="oauth-btn tiktok-btn">
        <span class="oauth-icon">{{platformIcon "tiktok"}}</span>
        <span>{{.I18n.T "login.tiktokLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('kick')" class="oauth-btn kick-btn">
        <span class="oauth-icon">{{platformIcon "kick"}}</span>
        <span>{{.I18n.T "login.kickLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('facebook')" class="oauth-btn facebook-btn">
        <span class="oauth-icon">{{platformIcon "facebook"}}</span>
        <span>{{.I18n.T "login.facebookLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('x')" class="oauth-btn x-btn">
        <span class="oauth-icon">{{platformIcon "x"}}</span>
        <span>{{.I18n.T "login.xLogin"}}</span>
    </button>
    <button type="button" onclick="startOAuthLogin('bilibili')" class="oauth-btn bilibili-btn">
        <span class="oauth-icon">{{platformIcon "bilibili"}}</span>
        <span>{{.I18n.T "login.bilibiliLogin"}}</span>
    </button>
</div>

<div class="footer-links">
    <p>{{.I18n.T "login.noAccountText"}}<a href="/register">{{.I18n.T "login.createAccountLink"}}</a></p>
</div>

<!-- NicoNico semi-OAuth modal -->
<div id="nicoOverlay" class="nico-overlay" style="display:none" onclick="if(event.target===this)closeNicoModal()">
    <div class="nico-box">
        <div id="nicoStep1">
            <div class="nico-box-header">
                <span class="nico-box-title">{{.I18n.T "login.niconicoDivider"}}</span>
                <button class="nico-box-close" onclick="closeNicoModal()">✕</button>
            </div>
            <div class="nico-box-body">
                <div class="nico-privacy-note">{{.I18n.T "login.nicoPrivacyNote"}}</div>
                <div class="nico-form-row">
                    <label for="nicoEmail">{{.I18n.T "login.nicoEmail"}}</label>
                    <input type="email" id="nicoEmail" autocomplete="email" placeholder="{{.I18n.T "login.nicoEmailPlaceholder"}}">
                </div>
                <div class="nico-form-row">
                    <label for="nicoPassword">{{.I18n.T "login.nicoPassword"}}</label>
                    <div class="nico-pw-field">
                        <input type="password" id="nicoPassword" autocomplete="off" placeholder="{{.I18n.T "login.nicoPasswordPlaceholder"}}">
                        <button type="button" class="nico-toggle-pw" onclick="toggleNicoPw()">👁</button>
                    </div>
                </div>
                <div id="nicoErr1" class="nico-err" style="display:none"></div>
            </div>
            <div class="nico-box-footer">
                <button class="btn btn-secondary" onclick="closeNicoModal()">{{.I18n.T "login.nicoCancel"}}</button>
                <button id="nicoLoginBtn" class="btn btn-primary" onclick="submitNicoLogin()">{{.I18n.T "login.nicoLoginButton"}}</button>
            </div>
        </div>
        <div id="nicoStep2" style="display:none">
            <div class="nico-box-header">
                <span class="nico-box-title">{{.I18n.T "login.niconicoDividerOtp"}}</span>
                <button class="nico-box-close" onclick="closeNicoModal()">✕</button>
            </div>
            <div class="nico-box-body">
                <p class="nico-mfa-desc">{{.I18n.T "login.nicoOtpDescription"}}</p>
                <div class="nico-otp-row">
                    <input type="text" id="nicoOtp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="{{.I18n.T "login.nicoOtpPlaceholder"}}">
                    <span id="nicoCountdown" class="nico-countdown"></span>
                </div>
                <div id="nicoErr2" class="nico-err" style="display:none"></div>
            </div>
            <div class="nico-box-footer">
                <button class="btn btn-secondary" onclick="backNicoStep1()">{{.I18n.T "login.nicoBackButton"}}</button>
                <button id="nicoMfaBtn" class="btn btn-primary" onclick="submitNicoMfa()">{{.I18n.T "login.nicoVerifyButton"}}</button>
            </div>
        </div>
    </div>
</div>
<div id="nicoToast" class="nico-toast"></div>

<script>
    // Handle form submission
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({ identifier, password })
            });
            
            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                const data = await response.json().catch(() => ({}));
                errorMessage.textContent = data.error || window._i18nMsg?.['login.nicoInvalidCredentials'] || 'Invalid username/email or password.';
                errorMessage.classList.add('show');
            }
        } catch (error) {
            errorMessage.textContent = window._i18nMsg?.['login.nicoErrorGeneric'] || 'An error occurred. Please try again.';
            errorMessage.classList.add('show');
        }
    });

    // If already logged in, go straight to dashboard
    document.addEventListener('DOMContentLoaded', async () => {
        const user = window.__user;
        if (user) window.location.replace('/dashboard');
    });

    // NicoNico semi-OAuth modal
    (function () {
        var _mfaSessionId = '';
        var _timer = null;
        var _seconds = 0;

        window.openNicoLoginModal = function () {
            document.getElementById('nicoEmail').value    = '';
            document.getElementById('nicoPassword').value = '';
            document.getElementById('nicoErr1').style.display = 'none';
            document.getElementById('nicoStep1').style.display = '';
            document.getElementById('nicoStep2').style.display = 'none';
            document.getElementById('nicoLoginBtn').disabled = false;
            document.getElementById('nicoLoginBtn').textContent = 'Login';
            document.getElementById('nicoOverlay').style.display = 'flex';
            document.getElementById('nicoEmail').focus();
        };

        window.closeNicoModal = function () {
            document.getElementById('nicoOverlay').style.display = 'none';
            clearTimer();
        };

        window.toggleNicoPw = function () {
            var f = document.getElementById('nicoPassword');
            f.type = f.type === 'password' ? 'text' : 'password';
        };

        window.backNicoStep1 = function () {
            clearTimer();
            _mfaSessionId = '';
            document.getElementById('nicoStep2').style.display = 'none';
            document.getElementById('nicoStep1').style.display = '';
            document.getElementById('nicoErr1').style.display  = 'none';
            document.getElementById('nicoLoginBtn').disabled = false;
            document.getElementById('nicoLoginBtn').textContent = 'Login';
        };

        window.submitNicoLogin = async function () {
            var email    = document.getElementById('nicoEmail').value.trim();
            var password = document.getElementById('nicoPassword').value;
            var btn      = document.getElementById('nicoLoginBtn');
            var errEl    = document.getElementById('nicoErr1');

            errEl.style.display = 'none';
            if (!email || !password) { showErr(errEl, window._i18nMsg?.['login.nicoErrorMissing'] || 'Please enter email and password.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="nico-spinner"></span>' + (window._i18nMsg?.['login.nicoLoggingIn'] || 'Logging in…');
            try {
                var resp = await fetch('/api/niconico/portal-login', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                var data = await resp.json();
                if (!resp.ok) { throw new Error(data.error || resp.statusText); }

                if (data.status === 'mfa_required') {
                    _mfaSessionId = data.mfa_session_id;
                    document.getElementById('nicoStep1').style.display = 'none';
                    document.getElementById('nicoStep2').style.display = '';
                    document.getElementById('nicoErr2').style.display  = 'none';
                    document.getElementById('nicoOtp').value = '';
                    document.getElementById('nicoMfaBtn').disabled = false;
                    document.getElementById('nicoMfaBtn').textContent = window._i18nMsg?.['login.nicoVerifyButton'] || 'Verify';
                    startTimer(600);
                    document.getElementById('nicoOtp').focus();
                } else if (data.status === 'logged_in') {
                    closeNicoModal();
                    showNicoToast(window._i18nMsg?.['login.nicoLoginSuccess'] || 'Logged in via NicoNico! ✅');
                    setTimeout(function () { window.location.href = '/dashboard'; }, 1200);
                } else {
                    throw new Error('Unexpected response from server.');
                }
            } catch (e) {
                showErr(errEl, e.message);
                btn.disabled = false;
                btn.textContent = window._i18nMsg?.['login.nicoLoginButton'] || 'Login';
            }
        };

        window.submitNicoMfa = async function () {
            var otp   = document.getElementById('nicoOtp').value.replace(/\s/g, '');
            var btn   = document.getElementById('nicoMfaBtn');
            var errEl = document.getElementById('nicoErr2');

            errEl.style.display = 'none';
            if (!otp) { showErr(errEl, window._i18nMsg?.['login.nicoErrorOtpMissing'] || 'Please enter the OTP code.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="nico-spinner"></span>' + (window._i18nMsg?.['login.nicoVerifying'] || 'Verifying…');
            try {
                var resp = await fetch('/api/niconico/portal-login/mfa', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mfa_session_id: _mfaSessionId, otp: otp })
                });
                var data = await resp.json();
                if (!resp.ok) {
                    if (resp.status === 401) {
                        // Wrong OTP — session still valid, let the user retry while timer runs
                        showErr(errEl, (data.error || window._i18nMsg?.['login.nicoIncorrectCode'] || 'Incorrect code.') + ' ' + (window._i18nMsg?.['login.nicoIncorrectCode'] || 'Please try again.'));
                        btn.disabled = false;
                        btn.textContent = window._i18nMsg?.['login.nicoVerifyButton'] || 'Verify';
                    } else {
                        // 400 expired / other fatal error — session is dead
                        clearTimer();
                        showErr(errEl, (data.error || window._i18nMsg?.['login.nicoSessionError'] || 'Session error.') + ' ' + (window._i18nMsg?.['login.nicoSessionError'] || 'Please go back and try again.'));
                        btn.disabled = true;
                        btn.textContent = window._i18nMsg?.['login.nicoVerifyButton'] || 'Verify';
                    }
                    return;
                }

                clearTimer();
                closeNicoModal();
                showNicoToast(window._i18nMsg?.['login.nicoLoginSuccess'] || 'Logged in via NicoNico! ✅');
                setTimeout(function () { window.location.href = '/dashboard'; }, 1200);
            } catch (e) {
                clearTimer();
                showErr(errEl, window._i18nMsg?.['login.nicoConnectionError'] || 'Connection error. Please go back and try again.');
                btn.disabled = true;
                btn.textContent = window._i18nMsg?.['login.nicoVerifyButton'] || 'Verify';
            }
        };

        function startTimer(seconds) {
            _seconds = seconds;
            clearTimer();
            updateCountdown();
            _timer = setInterval(function () {
                _seconds--;
                updateCountdown();
                if (_seconds <= 0) {
                    clearTimer();
                    document.getElementById('nicoMfaBtn').disabled = true;
                    showErr(document.getElementById('nicoErr2'), window._i18nMsg?.['login.nicoOtpExpired'] || 'OTP expired. Please go back and try again.');
                }
            }, 1000);
        }

        function clearTimer() {
            if (_timer) { clearInterval(_timer); _timer = null; }
            document.getElementById('nicoCountdown').textContent = '';
        }

        function updateCountdown() {
            var m = Math.floor(_seconds / 60);
            var s = _seconds % 60;
            document.getElementById('nicoCountdown').textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }

        function showErr(el, msg) {
            el.textContent = msg;
            el.style.display = '';
        }

        function showNicoToast(msg) {
            var t = document.getElementById('nicoToast');
            t.textContent = msg;
            t.classList.add('nico-toast-on');
            setTimeout(function () { t.classList.remove('nico-toast-on'); }, 3000);
        }
    })();
</script>
{{end}}
